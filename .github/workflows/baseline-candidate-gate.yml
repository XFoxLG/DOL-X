name: Baseline Candidate Gate

on:
  workflow_dispatch:

concurrency:
  group: baseline-candidate-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_CODES: "57602,58626,59650,61698"
  PROFILE: ucb-more-love-custom-spellbook-cheat-extended-maplebirch
  GATE_DIR: output/baseline-candidate-gate

jobs:
  phase1a-candidate-gate:
    name: Phase 1A ZIP/APK candidate gate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: "21"

      - name: Install APT packages
        run: sudo apt install -y unrar

      - name: Validate Phase 1A static config
        run: |
          python tools/baseline_candidate_gate.py validate-config \
            --output "${GATE_DIR}/baseline-candidate-config.json"

      - name: Check stable replacement readiness
        run: |
          python tools/baseline_candidate_gate.py stable-replacement-readiness \
            --output "${GATE_DIR}/baseline-candidate-stable-replacement-readiness.json"

      - name: Prepare game packages
        run: python main.py prepare --workspace "${{ github.workspace }}" -v

      - name: Setup signing key
        run: |
          echo ${{ secrets.SIGNING_KEY }} > dol.base64
          base64 -d dol.base64 > dol.jks

      - name: Warmup beautify resources
        run: python main.py warmup --workspace "${{ github.workspace }}" -v

      - name: Build candidate ZIP artifacts
        run: |
          python tools/baseline_candidate_gate.py build \
            --pack-type zip \
            --workspace "${{ github.workspace }}" \
            --output-dir "${{ github.workspace }}/${GATE_DIR}/zip-artifacts" \
            --report "${GATE_DIR}/baseline-candidate-zip-build.json" \
            --ensure-payloads

      - name: Build candidate APK artifacts
        run: |
          python tools/baseline_candidate_gate.py build \
            --pack-type apk \
            --workspace "${{ github.workspace }}" \
            --output-dir "${{ github.workspace }}/${GATE_DIR}/apk-artifacts" \
            --report "${GATE_DIR}/baseline-candidate-apk-build.json" \
            --ensure-payloads

      - name: Audit candidate ZIP artifacts
        run: |
          python tools/baseline_candidate_gate.py audit-zip \
            "${{ github.workspace }}/${GATE_DIR}/zip-artifacts" \
            --output "${GATE_DIR}/baseline-candidate-zip-audit.json"

      - name: Audit candidate APK artifacts
        run: |
          python tools/baseline_candidate_gate.py audit-apk \
            "${{ github.workspace }}/${GATE_DIR}/apk-artifacts" \
            --output "${GATE_DIR}/baseline-candidate-apk-audit.json"

      - name: Derive smoke-debug APK artifacts
        run: |
          python tools/baseline_candidate_gate.py derive-debug-apk \
            "${{ github.workspace }}/${GATE_DIR}/apk-artifacts" \
            --output-dir "${{ github.workspace }}/${GATE_DIR}/apk-debug-artifacts" \
            --output "${GATE_DIR}/baseline-candidate-apk-debug-derivation.json"

      - name: Audit release/debug APK equivalence
        run: |
          python tools/baseline_candidate_gate.py audit-apk-equivalence \
            --release-target "${{ github.workspace }}/${GATE_DIR}/apk-artifacts" \
            --debug-target "${{ github.workspace }}/${GATE_DIR}/apk-debug-artifacts" \
            --output "${GATE_DIR}/baseline-candidate-apk-equivalence.json"

      - name: Install browser smoke dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run candidate ZIP browser smokes
        env:
          DOLX_WORKFLOW_RUN_ID: ${{ github.run_id }}
          DOLX_WORKFLOW_HEAD_BRANCH: ${{ github.ref_name }}
          DOLX_WORKFLOW_HEAD_SHA: ${{ github.sha }}
          DOLX_GITHUB_SHA: ${{ github.sha }}
          DOLX_ARTIFACT_NAME: baseline-candidate-zip-artifacts
        run: |
          ZIP_DIR="${{ github.workspace }}/${GATE_DIR}/zip-artifacts"
          for slug in base au-f au-m au-a; do
            if [[ "$slug" == "base" ]]; then
              ZIP_FILE=$(find "$ZIP_DIR" -maxdepth 1 -type f -name "*.zip" -name "*ucb-more-love-custom-spellbook-cheat-extended-maplebirch*" ! -name "*-au-*" | sort | head -n 1)
            else
              ZIP_FILE=$(find "$ZIP_DIR" -maxdepth 1 -type f -name "*.zip" -name "*-${slug}-*" -name "*cheat-extended-maplebirch*" | sort | head -n 1)
            fi
            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::missing candidate ZIP for ${slug}"
              exit 1
            fi
            python tools/browser_smoke_test.py "$ZIP_FILE" \
              --profile "$PROFILE" \
              --output-dir "${GATE_DIR}/browser-smoke/${slug}"
          done

      - name: Summarize candidate browser smokes
        run: |
          python tools/baseline_candidate_gate.py summarize-browser \
            --reports-dir "${GATE_DIR}/browser-smoke" \
            --output "${GATE_DIR}/baseline-candidate-zip-browser-summary.json"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run candidate APK CDP smokes
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DOLX_WORKFLOW_RUN_ID: ${{ github.run_id }}
          DOLX_WORKFLOW_HEAD_BRANCH: ${{ github.ref_name }}
          DOLX_WORKFLOW_HEAD_SHA: ${{ github.sha }}
          DOLX_GITHUB_SHA: ${{ github.sha }}
          DOLX_ARTIFACT_NAME: baseline-candidate-apk-debug-artifacts
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            python tools/baseline_candidate_gate.py run-apk-cdp
            "${{ github.workspace }}/${GATE_DIR}/apk-debug-artifacts"
            --reports-dir "${GATE_DIR}/apk-cdp-smoke"
            --profile "$PROFILE"

      - name: Summarize candidate APK CDP smokes
        if: always()
        run: |
          python tools/baseline_candidate_gate.py summarize-apk-cdp \
            --reports-dir "${GATE_DIR}/apk-cdp-smoke" \
            --output "${GATE_DIR}/baseline-candidate-apk-cdp-smoke.json"

      - name: Summarize candidate gate
        if: always()
        run: |
          python tools/baseline_candidate_gate.py summarize-phase1a \
            --gate-dir "${GATE_DIR}" \
            --output "${GATE_DIR}/baseline-candidate-phase1a-summary.json" \
            --head-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}"

      - name: Upload candidate ZIP artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-candidate-zip-artifacts
          path: ${{ github.workspace }}/output/baseline-candidate-gate/zip-artifacts/*.zip
          if-no-files-found: error

      - name: Upload candidate APK artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-candidate-apk-artifacts
          path: ${{ github.workspace }}/output/baseline-candidate-gate/apk-artifacts/*.apk
          if-no-files-found: error

      - name: Upload smoke-debug APK artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-candidate-apk-debug-artifacts
          path: ${{ github.workspace }}/output/baseline-candidate-gate/apk-debug-artifacts/*.apk
          if-no-files-found: error

      - name: Upload APK CDP smoke reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-candidate-apk-cdp-smoke-reports
          path: ${{ github.workspace }}/output/baseline-candidate-gate/apk-cdp-smoke/**
          if-no-files-found: error

      - name: Upload candidate gate reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-candidate-gate-reports
          path: |
            ${{ github.workspace }}/output/baseline-candidate-gate/*.json
            ${{ github.workspace }}/output/baseline-candidate-gate/browser-smoke/**
            ${{ github.workspace }}/output/baseline-candidate-gate/apk-cdp-smoke/**
            !${{ github.workspace }}/output/baseline-candidate-gate/zip-artifacts/**
            !${{ github.workspace }}/output/baseline-candidate-gate/apk-artifacts/**
            !${{ github.workspace }}/output/baseline-candidate-gate/apk-debug-artifacts/**
          if-no-files-found: error
