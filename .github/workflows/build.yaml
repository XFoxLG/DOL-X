name: Build

on:
  push:
    branches:
      - vega
    tags:
      - "*"
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"                                      # 文档修改不触发
      - ".vscode/**"                                   # VSCode 配置不触发
      - "*.md"                                         # 所有 Markdown 文件
      - ".gitignore"
      - "CLEANUP_PLAN.md"
      - "BUILD_VERIFICATION_REPORT.md"
      - ".github/workflows/trigger.yaml"
      - ".github/workflows/deploy-hub.yaml"
      - ".github/workflows/compatibility.yaml"         # 兼容性测试单独管理
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: "21"

      - name: Install APT packages
        run: sudo apt install -y unrar

      # 下载并预处理游戏资源
      - name: Prepare game packages
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            python main.py prepare --workspace "${{ github.workspace }}" --tag "${{ github.ref_name }}" -v
          else
            python main.py prepare --workspace "${{ github.workspace }}" -v
          fi

      - name: Setup signing key
        run: |
          echo ${{ secrets.SIGNING_KEY }} > dol.base64
          base64 -d dol.base64 > dol.jks

      # 预热美化资源
      - name: Warmup beautify resources
        run: |
          python main.py warmup --workspace "${{ github.workspace }}" -v

      # 并行构建所有组合
      - name: Build all combinations
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            python main.py build --workspace "${{ github.workspace }}" --tag "${{ github.ref_name }}" --jobs 4 -v
          else
            python main.py build --workspace "${{ github.workspace }}" --jobs 4 -v
          fi

      - name: List outputs
        run: ls -lah "${{ github.workspace }}/output/" || echo "No output files generated"

      - name: Build cheatExtended/maplebirch canary ZIP
        if: github.ref_name == 'experiment/cheat-extended-maplebirch'
        id: cheat_canary
        run: |
          python tools/cheat_extended_canary.py \
            --flavor stable-replacement \
            --variant base \
            --workspace "${{ github.workspace }}" \
            --ensure-payloads \
            --build \
            --maplebirch-release-tag maplebirch-release-v3.1.13 \
            --maplebirch-asset-pattern maplebirch-0.5.8.10-v3.1.13.mod.zip \
            --maplebirch-cache-label maplebirch-release-v3.1.13 \
            --output "${{ github.workspace }}/output/cheat-extended-canary-stable-replacement-base-build.json"

          CANARY_ZIP=$(find "${{ github.workspace }}/output" -maxdepth 1 -type f -name "*ucb-cheat-extended-maplebirch*.zip" | sort | head -n 1)
          if [[ -z "$CANARY_ZIP" ]]; then
            echo "::error::cheatExtended/maplebirch canary ZIP was not produced"
            exit 1
          fi

          echo "zip=$CANARY_ZIP" >> "$GITHUB_OUTPUT"

      - name: Run cheatExtended/maplebirch canary HTML smoke
        if: github.ref_name == 'experiment/cheat-extended-maplebirch' && steps.cheat_canary.outputs.zip != ''
        run: |
          python tools/html_smoke_test.py \
            "${{ steps.cheat_canary.outputs.zip }}" \
            --output "${{ github.workspace }}/output/html-smoke-cheat-canary-stable-replacement-base.json"

      - name: Pick sample outputs (non-tag)
        if: github.ref_type != 'tag'
        id: sample
        run: |
          ZIP_FILE=$(find "${{ github.workspace }}/output" -maxdepth 1 -type f -name "*.zip" ! -name "*-au-*" ! -name "*cheat-extended-maplebirch*" | sort | head -n 1)
          if [[ -z "$ZIP_FILE" ]]; then
            ZIP_FILE=$(find "${{ github.workspace }}/output" -maxdepth 1 -type f -name "*.zip" ! -name "*cheat-extended-maplebirch*" | sort | head -n 1)
          fi
          APK_FILE=$(find "${{ github.workspace }}/output" -maxdepth 1 -type f -name "*.apk" | sort | head -n 1)

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP sample artifact (non-tag)
        if: github.ref_type != 'tag' && steps.sample.outputs.zip != ''
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-zip-sample
          path: ${{ steps.sample.outputs.zip }}

      - name: Upload APK sample artifact (non-tag)
        if: github.ref_type != 'tag' && steps.sample.outputs.apk != ''
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-apk-sample
          path: ${{ steps.sample.outputs.apk }}

      - name: Upload cheatExtended/maplebirch canary ZIP artifact
        if: github.ref_name == 'experiment/cheat-extended-maplebirch' && steps.cheat_canary.outputs.zip != ''
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-cheat-canary-zip
          path: ${{ steps.cheat_canary.outputs.zip }}

      - name: Upload cheatExtended/maplebirch canary reports
        if: github.ref_name == 'experiment/cheat-extended-maplebirch'
        uses: actions/upload-artifact@v6
        with:
          name: cheat-canary-build-reports
          path: |
            ${{ github.workspace }}/output/cheat-extended-canary-stable-replacement-base-build.json
            ${{ github.workspace }}/output/html-smoke-cheat-canary-stable-replacement-base.json
          if-no-files-found: error

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-zip
          path: ${{ github.workspace }}/output/*.zip

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-apk
          path: ${{ github.workspace }}/output/*.apk

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-zip
          path: outputs/

      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-apk
          path: outputs/

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: outputs/{*.zip,*.apk}
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          make_latest: true
          release_name: ${{ github.ref_name }}
