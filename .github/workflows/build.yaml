name: Build

on:
  push:
    branches:
      - vega
    tags:
      - "*"
      - "!*-mirror-*"  # 忽略镜像 tags (imagepack-mirror-*, cheat-extended-mirror-*)
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"                                      # 文档修改不触发
      - ".vscode/**"                                   # VSCode 配置不触发
      - "*.md"                                         # 所有 Markdown 文件
      - ".gitignore"
  workflow_dispatch:

# release job 用 svenstaro/upload-release-action 创建 Release 需要写权限。
# GitHub 收紧默认 token 权限后，缺声明会导致创建 Release 报 "Not Found"（403）。
permissions:
  contents: write

env:
  # 分支推送构建 base + AU-F；tag 发版构建全部四个组合。
  # 逗号分隔：CLI 的 --codes 按逗号拆分，不拆空格。
  BRANCH_BUILD_CODES: "15704320,15705344"
  RELEASE_BUILD_CODES: "15704320,15705344,15706368,15708416"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: "21"

      - name: Install APT packages
        run: sudo apt install -y unrar

      # 下载并预处理游戏资源
      - name: Prepare game packages
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            python main.py prepare --workspace "${{ github.workspace }}" --tag "${{ github.ref_name }}" -v
          else
            python main.py prepare --workspace "${{ github.workspace }}" -v
          fi

      - name: Setup signing key
        run: |
          echo ${{ secrets.SIGNING_KEY }} > dol.base64
          base64 -d dol.base64 > dol.jks

      - name: Select build codes
        id: codes
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${RELEASE_BUILD_CODES}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${BRANCH_BUILD_CODES}" >> "$GITHUB_OUTPUT"
          fi

      - name: Warmup beautify resources
        run: |
          python main.py warmup --workspace "${{ github.workspace }}" --codes "${{ steps.codes.outputs.value }}" -v

      - name: Build combinations
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            python main.py build --workspace "${{ github.workspace }}" --tag "${{ github.ref_name }}" --codes "${{ steps.codes.outputs.value }}" --jobs 2 -v
          else
            python main.py build --workspace "${{ github.workspace }}" --codes "${{ steps.codes.outputs.value }}" --jobs 2 -v
          fi

      - name: List outputs
        run: ls -lah "${{ github.workspace }}/output/" || echo "No output files generated"

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-zip
          path: ${{ github.workspace }}/output/*.zip
          retention-days: 30

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-apk
          path: ${{ github.workspace }}/output/*.apk
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-zip
          path: outputs/

      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-apk
          path: outputs/

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: outputs/{*.zip,*.apk}
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          make_latest: true
          release_name: ${{ github.ref_name }}
