name: Build

on:
  push:
    branches:
      - vega
    tags:
      - "*"
      - "!*-mirror-*"  # 忽略镜像 tags (imagepack-mirror-*, cheat-extended-mirror-*)
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"                                      # 文档修改不触发
      - ".vscode/**"                                   # VSCode 配置不触发
      - "*.md"                                         # 所有 Markdown 文件
      - ".gitignore"
      - "CLEANUP_PLAN.md"
      - "BUILD_VERIFICATION_REPORT.md"
      - ".github/workflows/trigger.yaml"
      - ".github/workflows/deploy-hub.yaml"
  workflow_dispatch:

# release job 用 svenstaro/upload-release-action 创建 Release 需要写权限。
# GitHub 收紧默认 token 权限后，缺声明会导致创建 Release 报 "Not Found"（403）。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: "21"

      - name: Install APT packages
        run: sudo apt install -y unrar

      # 下载并预处理游戏资源
      - name: Prepare game packages
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            python main.py prepare --workspace "${{ github.workspace }}" --tag "${{ github.ref_name }}" -v
          else
            python main.py prepare --workspace "${{ github.workspace }}" -v
          fi

      - name: Setup signing key
        run: |
          echo ${{ secrets.SIGNING_KEY }} > dol.base64
          base64 -d dol.base64 > dol.jks

      # 预热美化资源
      - name: Warmup beautify resources
        run: |
          python main.py warmup --workspace "${{ github.workspace }}" -v

      # 并行构建所有组合
      - name: Build all combinations
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            python main.py build --workspace "${{ github.workspace }}" --tag "${{ github.ref_name }}" --jobs 4 -v
          else
            python main.py build --workspace "${{ github.workspace }}" --jobs 4 -v
          fi

      - name: List outputs
        run: ls -lah "${{ github.workspace }}/output/" || echo "No output files generated"

      - name: Pick sample outputs (non-tag)
        if: github.ref_type != 'tag'
        id: sample
        run: |
          ZIP_FILE=$(find "${{ github.workspace }}/output" -maxdepth 1 -type f -name "*.zip" ! -name "*-au-*" | sort | head -n 1)
          if [[ -z "$ZIP_FILE" ]]; then
            ZIP_FILE=$(find "${{ github.workspace }}/output" -maxdepth 1 -type f -name "*.zip" | sort | head -n 1)
          fi
          APK_FILE=$(find "${{ github.workspace }}/output" -maxdepth 1 -type f -name "*.apk" | sort | head -n 1)

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP sample artifact (non-tag)
        if: github.ref_type != 'tag' && steps.sample.outputs.zip != ''
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-zip-sample
          path: ${{ steps.sample.outputs.zip }}
          retention-days: 30

      - name: Upload APK sample artifact (non-tag)
        if: github.ref_type != 'tag' && steps.sample.outputs.apk != ''
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-apk-sample
          path: ${{ steps.sample.outputs.apk }}
          retention-days: 30

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-zip
          path: ${{ github.workspace }}/output/*.zip
          retention-days: 30

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-apk
          path: ${{ github.workspace }}/output/*.apk
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-zip
          path: outputs/

      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-apk
          path: outputs/

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: outputs/{*.zip,*.apk}
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          make_latest: true
          release_name: ${{ github.ref_name }}
