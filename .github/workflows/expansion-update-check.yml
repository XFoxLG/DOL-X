name: Expansion Update Check

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on 1st at 00:00 UTC
  workflow_dispatch:

jobs:
  check-expansion-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check expansion release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="release-v1.2.4"
          LATEST=$(gh api repos/MaplebirchLeaf/SCML-DOL-maplebirchExpansion/releases/latest --jq '.tag_name' || echo "$CURRENT")
          
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          
          if [[ "$LATEST" != "$CURRENT" ]]; then
            echo "update_available=true" >> $GITHUB_OUTPUT
          else
            echo "update_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if update available
        if: steps.check.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="${{ steps.check.outputs.current }}"
          LATEST="${{ steps.check.outputs.latest }}"
          
          ISSUE_TITLE="expansion updated to $LATEST - review v4.x compatibility"
          
          ISSUE_BODY="## Expansion Update Detected
          
          **Current version**: $CURRENT  
          **New version**: $LATEST
          
          ### Action Required
          
          1. Check [release notes](https://github.com/MaplebirchLeaf/SCML-DOL-maplebirchExpansion/releases/tag/$LATEST) for v4.x compatibility
          2. If native v4.x support added:
             - Remove \`patches/expansion_v4_compat.js\`
             - Remove patch injection logic from \`lyra/build.py\`
             - Update \`config/build.toml\` release_tag
             - Update \`config/mods.lock.json\` notes
          3. Test locally before merging
          4. Update AGENTS.md removal steps
          
          ### Verification Checklist
          
          - [ ] Reviewed upstream release notes
          - [ ] Confirmed v4.x compatibility (native or still needs patch)
          - [ ] Tested locally with maplebirch v4.1.8
          - [ ] Verified expansion module loads correctly
          - [ ] Tested expansion features (music player, longer combat, sanity)
          - [ ] Updated documentation if patch removed
          
          ---
          *Auto-generated by expansion-update-check workflow*"
          
          # Check if issue already exists
          EXISTING=$(gh issue list --state open --label "dependency-update" --search "expansion updated to $LATEST" --json number --jq '.[0].number' || echo "")
          
          if [[ -z "$EXISTING" ]]; then
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_BODY" \
              --label "dependency-update,mod-upgrade" \
              --assignee "@me"
            echo "Created new issue for expansion $LATEST"
          else
            echo "Issue already exists: #$EXISTING"
          fi
