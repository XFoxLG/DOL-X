name: Sweep

# 引擎 A（剧情 / 战斗 / 环境）的云端测试入口。
# prepare 阶段先按锁定 tag 构建真实整合包（warmup + build zip），再做 fail-closed
# 身份核验（StartConfig.version + 期望 Mod 名单），各分片下载同一份产物跑测试；
# 每个分片带身份台账和完整性块，summary job 对缺分片、重复结果、身份漂移做
# fail-closed 汇总。报告先经过 report_sanitize 白名单导出后才上传。
#
# 2026-10-06 教训（run 37500965698）：不传 --tag 的 prepare 会构建上游最新版本
# （当时是 0.5.12.13）；只上传 prepare HTML 则测试的是不含 DOL-X mod 的空壳载体。
# 两者都会让"全绿报告"测的不是目标产品，因此现在默认在 prepare 内完成
# warmup + build zip，并只上传已核验的构建产物。

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "测试档"
        type: choice
        default: daily
        options:
          - daily
          - full
          - combat-full
          - env-full
      tag:
        description: "目标 tag（v{本体}-{汉化}-{日期}）"
        type: string
        default: "v0.5.11.9-1.0.0a-0915"
      code:
        description: "构建码（base 15704320 / AU-F 15705344 / AU-M 15706368 / AU-A 15708416）"
        type: string
        default: "15704320"
      expect_mods:
        description: "必须嵌入的 mod 名单（逗号分隔，大小写/空格不敏感）"
        type: string
        default: "maplebirch,cheat extended,More Love Interests Mod,CustomHair,longer-combat,yanling-cheat-collection,DOLI,ModI18N"

permissions:
  contents: read

concurrency:
  group: sweep-${{ github.ref }}-${{ inputs.tier }}
  cancel-in-progress: false

env:
  SWEEP_SEED: "20261005"
  TARGET_TAG: ${{ inputs.tag }}
  TARGET_CODE: ${{ inputs.code }}
  EXPECT_MODS: ${{ inputs.expect_mods }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install APT packages
        run: sudo apt install -y unrar

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Prepare game packages
        run: python main.py prepare --workspace "${{ github.workspace }}" --tag "$TARGET_TAG" -v

      - name: Warm up build resources
        run: python main.py warmup --workspace "${{ github.workspace }}" --codes "$TARGET_CODE" -v

      - name: Build target combination (zip)
        run: |
          python main.py build zip --workspace "${{ github.workspace }}" \
            --tag "$TARGET_TAG" --codes "$TARGET_CODE" \
            --manifest build-manifest-sweep.json -v

      - name: Package identity gate
        run: |
          set -euo pipefail
          ZIP="$(find output -maxdepth 1 -name 'DoL-*.zip' -print -quit)"
          if [ -z "${ZIP}" ]; then
            echo "::error::build did not produce a DoL-*.zip under output/"
            exit 1
          fi
          VERSION="${TARGET_TAG#v}"
          VERSION="${VERSION%%-*}"
          python tools/target_package_check.py "$ZIP" \
            --expect "$EXPECT_MODS" --expect-version "$VERSION" --min-mods 30 \
            --write-manifest prepared/mods-manifest.json

      - name: Extract tested package
        run: |
          set -euo pipefail
          ZIP="$(find output -maxdepth 1 -name 'DoL-*.zip' -print -quit)"
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$ZIP" prepared/package
          HTML="$(find prepared/package -name 'Degrees of Lewdity.html' -print -quit)"
          if [ -z "${HTML}" ]; then
            echo "::error::extracted package does not contain Degrees of Lewdity.html"
            exit 1
          fi
          echo "HTML_PATH=${HTML}" >> "$GITHUB_ENV"

      - name: Capture synthetic fixture
        run: |
          set -euo pipefail
          python tools/fixture_ladder.py capture "$HTML_PATH" \
            --out .local/fixtures/ci-base.json --label ci-base
          test -s .local/fixtures/ci-base.json

      - name: Upload target package
        uses: actions/upload-artifact@v6
        with:
          name: sweep-package
          path: |
            output/*.zip
            prepared/mods-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload synthetic fixture
        uses: actions/upload-artifact@v6
        with:
          name: sweep-fixture
          path: .local/fixtures/ci-base.json
          if-no-files-found: error
          retention-days: 7

  daily:
    needs: prepare
    if: inputs.tier == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-package
          path: prepared/archive
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Verify package identity
        run: |
          set -euo pipefail
          ZIP="$(find prepared/archive -maxdepth 2 -name '*.zip' -print -quit)"
          test -n "${ZIP}"
          VERSION="${TARGET_TAG#v}"
          VERSION="${VERSION%%-*}"
          python tools/target_package_check.py "$ZIP" \
            --expect "$EXPECT_MODS" --expect-version "$VERSION" --min-mods 30
          rm -rf prepared/package
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$ZIP" prepared/package
          HTML="$(find prepared/package -name 'Degrees of Lewdity.html' -print -quit)"
          test -n "${HTML}"
          echo "HTML_PATH=${HTML}" >> "$GITHUB_ENV"
      - name: Run daily tier
        run: |
          set -uo pipefail
          HTML="${HTML_PATH}"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          test -n "${HTML}"
          test -n "${FIXTURE}"
          STATUS=0
          # Mod 内容（2026-10-07）：mod passage 只在运行时合并进 Story，静态
          # extract_passages 永远看不到。先盘点（可游玩 / widget / 加密不透明），
          # 再把可游玩 passage 纳入扫描；列表为空视为覆盖回归。
          python tools/mod_passage_inventory.py "$HTML" \
            --out .local/sweep/daily-mod-inventory \
            --json .local/sweep/daily-mod-inventory/mod-inventory-report.json \
            --md .local/sweep/daily-mod-inventory/mod-inventory-report.md \
            --write-list .local/sweep/daily-mod-passages.txt || STATUS=1
          if [ ! -s .local/sweep/daily-mod-passages.txt ]; then
            echo "::error::mod inventory produced an empty playable-passage list"
            STATUS=1
          else
            python tools/passage_sweep.py "$HTML" \
              --only-file .local/sweep/daily-mod-passages.txt --allow-runtime-only \
              --out .local/sweep/daily-mod-passages || STATUS=1
          fi
          python tools/passage_sweep.py "$HTML" --fixture "$FIXTURE" \
            --sample 300 --seed "$SWEEP_SEED" --out .local/sweep/daily-passage || STATUS=1
          python tools/scenario_sweep.py "$HTML" --fixture "$FIXTURE" \
            --suite all --seed "$SWEEP_SEED" --out .local/sweep/daily-scenario || STATUS=1
          python tools/combat_sweep.py "$HTML" --fixture "$FIXTURE" \
            --tier archetypes --seed "$SWEEP_SEED" --out .local/sweep/daily-combat || STATUS=1
          python tools/env_matrix.py --target "$HTML" --fixture "$FIXTURE" \
            --tier daily --seed "$SWEEP_SEED" --out .local/sweep/daily-env || STATUS=1
          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::daily tier reported failures; mod inventory + all four sweep axes still ran for a complete report set"
          fi
          exit "${STATUS}"
      - name: Export sanitized reports
        id: export
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
          test -n "$(find sweep-reports -type f -print -quit)"
      - uses: actions/upload-artifact@v6
        if: always() && steps.export.outcome == 'success'
        with:
          name: sweep-daily
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  passage-shards:
    needs: prepare
    if: inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-package
          path: prepared/archive
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Verify package identity
        run: |
          set -euo pipefail
          ZIP="$(find prepared/archive -maxdepth 2 -name '*.zip' -print -quit)"
          test -n "${ZIP}"
          VERSION="${TARGET_TAG#v}"
          VERSION="${VERSION%%-*}"
          python tools/target_package_check.py "$ZIP" \
            --expect "$EXPECT_MODS" --expect-version "$VERSION" --min-mods 30
          rm -rf prepared/package
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$ZIP" prepared/package
          HTML="$(find prepared/package -name 'Degrees of Lewdity.html' -print -quit)"
          test -n "${HTML}"
          echo "HTML_PATH=${HTML}" >> "$GITHUB_ENV"
      - name: Run passage shard
        run: |
          set -euo pipefail
          HTML="${HTML_PATH}"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          python tools/passage_sweep.py "$HTML" --fixture "$FIXTURE" \
            --shard-index "${{ matrix.shard }}" --shard-count 4 \
            --out ".local/sweep/passage-shard-${{ matrix.shard }}"
      - name: Export sanitized reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-passage-shard-${{ matrix.shard }}
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  scenario:
    needs: prepare
    if: inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-package
          path: prepared/archive
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Verify package identity
        run: |
          set -euo pipefail
          ZIP="$(find prepared/archive -maxdepth 2 -name '*.zip' -print -quit)"
          test -n "${ZIP}"
          VERSION="${TARGET_TAG#v}"
          VERSION="${VERSION%%-*}"
          python tools/target_package_check.py "$ZIP" \
            --expect "$EXPECT_MODS" --expect-version "$VERSION" --min-mods 30
          rm -rf prepared/package
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$ZIP" prepared/package
          HTML="$(find prepared/package -name 'Degrees of Lewdity.html' -print -quit)"
          test -n "${HTML}"
          echo "HTML_PATH=${HTML}" >> "$GITHUB_ENV"
      - name: Run scenario suite
        run: |
          set -euo pipefail
          HTML="${HTML_PATH}"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          python tools/scenario_sweep.py "$HTML" --fixture "$FIXTURE" \
            --suite all --seed "$SWEEP_SEED" --out .local/sweep/full-scenario
      - name: Export sanitized reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-scenario
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  env-shards:
    needs: prepare
    if: inputs.tier == 'full' || inputs.tier == 'env-full'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-package
          path: prepared/archive
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Verify package identity
        run: |
          set -euo pipefail
          ZIP="$(find prepared/archive -maxdepth 2 -name '*.zip' -print -quit)"
          test -n "${ZIP}"
          VERSION="${TARGET_TAG#v}"
          VERSION="${VERSION%%-*}"
          python tools/target_package_check.py "$ZIP" \
            --expect "$EXPECT_MODS" --expect-version "$VERSION" --min-mods 30
          rm -rf prepared/package
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$ZIP" prepared/package
          HTML="$(find prepared/package -name 'Degrees of Lewdity.html' -print -quit)"
          test -n "${HTML}"
          echo "HTML_PATH=${HTML}" >> "$GITHUB_ENV"
      - name: Run environment shard
        run: |
          set -euo pipefail
          HTML="${HTML_PATH}"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          python tools/env_matrix.py --target "$HTML" --fixture "$FIXTURE" \
            --tier full --shard-index "${{ matrix.shard }}" --shard-count 8 \
            --seed "$SWEEP_SEED" --out ".local/sweep/env-shard-${{ matrix.shard }}"
      - name: Export sanitized reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-env-shard-${{ matrix.shard }}
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  combat-shards:
    needs: prepare
    if: inputs.tier == 'combat-full'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-package
          path: prepared/archive
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Verify package identity
        run: |
          set -euo pipefail
          ZIP="$(find prepared/archive -maxdepth 2 -name '*.zip' -print -quit)"
          test -n "${ZIP}"
          VERSION="${TARGET_TAG#v}"
          VERSION="${VERSION%%-*}"
          python tools/target_package_check.py "$ZIP" \
            --expect "$EXPECT_MODS" --expect-version "$VERSION" --min-mods 30
          rm -rf prepared/package
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$ZIP" prepared/package
          HTML="$(find prepared/package -name 'Degrees of Lewdity.html' -print -quit)"
          test -n "${HTML}"
          echo "HTML_PATH=${HTML}" >> "$GITHUB_ENV"
      - name: Run combat shard
        run: |
          set -euo pipefail
          HTML="${HTML_PATH}"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          python tools/combat_sweep.py "$HTML" --fixture "$FIXTURE" \
            --tier initiators --shard-index "${{ matrix.shard }}" --shard-count 8 \
            --seed "$SWEEP_SEED" --out ".local/sweep/combat-shard-${{ matrix.shard }}"
      - name: Build static coverage ledger
        if: always()
        run: |
          set -euo pipefail
          HTML="${HTML_PATH:-}"
          if [ -z "${HTML}" ]; then
            echo "HTML_PATH not set (package verify failed earlier); skipping static ledger"
            exit 0
          fi
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit || true)"
          REPORT=".local/sweep/combat-shard-${{ matrix.shard }}/combat-sweep.json"
          ARGS=()
          if [ -n "${FIXTURE}" ]; then ARGS+=(--fixture "${FIXTURE}"); fi
          if [ -f "${REPORT}" ]; then ARGS+=(--report "${REPORT}"); fi
          python tools/combat_ledger.py "${HTML}" "${ARGS[@]}" \
            --out ".local/sweep/combat-ledger-${{ matrix.shard }}"
      - name: Export sanitized reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \
               -o -name 'combat-ledger*.json' -o -name 'combat-ledger*.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-combat-shard-${{ matrix.shard }}
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  summary:
    needs:
      - prepare
      - daily
      - passage-shards
      - scenario
      - env-shards
      - combat-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v6
        with:
          pattern: sweep-*
          path: shard-artifacts
          merge-multiple: true
      - name: Aggregate shards
        run: |
          set -euo pipefail
          case "${{ inputs.tier }}" in
            daily) EXPECTED=4 ;;
            full) EXPECTED=13 ;;
            combat-full) EXPECTED=8 ;;
            env-full) EXPECTED=8 ;;
            *) echo "unknown tier"; exit 2 ;;
          esac
          REPORTS="$(find shard-artifacts -type f \( -name '*-sweep.json' -o -name '*-report.json' \) | sort)"
          if [ -z "${REPORTS}" ]; then
            echo "::error::no sanitized shard reports downloaded"
            exit 1
          fi
          python tools/sweep_summary.py ${REPORTS} \
            --expected-shards "${EXPECTED}" --out sweep-summary
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-summary-${{ github.run_id }}
          path: sweep-summary
          if-no-files-found: error
          retention-days: 30
