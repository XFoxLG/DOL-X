name: Sweep

# 引擎 A（剧情 / 战斗 / 环境）的云端测试入口。
# 目标产物只准备一次，各分片下载同一份 HTML 与合成夹具；每个分片带
# 身份台账和完整性块，最后 summary job 对缺分片、重复结果、身份漂移做
# fail-closed 汇总。报告先经过 report_sanitize 白名单导出后才上传。

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "测试档"
        type: choice
        default: daily
        options:
          - daily
          - full
          - combat-full
          - env-full

permissions:
  contents: read

concurrency:
  group: sweep-${{ github.ref }}-${{ inputs.tier }}
  cancel-in-progress: false

env:
  SWEEP_SEED: "20261005"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install APT packages
        run: sudo apt install -y unrar

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Prepare game packages
        run: python main.py prepare --workspace "${{ github.workspace }}" -v

      - name: Locate built HTML
        run: |
          set -euo pipefail
          HTML="$(find workspace/prepare_package -name 'Degrees of Lewdity.html' -print -quit)"
          if [ -z "${HTML}" ]; then
            echo "::error::prepare did not produce Degrees of Lewdity.html"
            exit 1
          fi
          echo "HTML_PATH=${HTML}" >> "$GITHUB_ENV"

      - name: Capture synthetic fixture
        run: |
          set -euo pipefail
          python tools/fixture_ladder.py capture "$HTML_PATH" \
            --out .local/fixtures/ci-base.json --label ci-base
          test -s .local/fixtures/ci-base.json

      - name: Upload prepared HTML
        uses: actions/upload-artifact@v6
        with:
          name: sweep-html
          path: ${{ env.HTML_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload synthetic fixture
        uses: actions/upload-artifact@v6
        with:
          name: sweep-fixture
          path: .local/fixtures/ci-base.json
          if-no-files-found: error
          retention-days: 7

  daily:
    needs: prepare
    if: inputs.tier == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-html
          path: prepared/html
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Run daily tier
        run: |
          set -euo pipefail
          HTML="$(find prepared/html -name 'Degrees of Lewdity.html' -print -quit)"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          test -n "${HTML}"
          test -n "${FIXTURE}"
          python tools/passage_sweep.py "$HTML" --fixture "$FIXTURE" \
            --sample 300 --seed "$SWEEP_SEED" --out .local/sweep/daily-passage
          python tools/scenario_sweep.py "$HTML" --fixture "$FIXTURE" \
            --suite all --seed "$SWEEP_SEED" --out .local/sweep/daily-scenario
          python tools/combat_sweep.py "$HTML" --fixture "$FIXTURE" \
            --tier archetypes --seed "$SWEEP_SEED" --out .local/sweep/daily-combat
          python tools/env_matrix.py --target "$HTML" --fixture "$FIXTURE" \
            --tier daily --seed "$SWEEP_SEED" --out .local/sweep/daily-env
      - name: Export sanitized reports
        id: export
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
          test -n "$(find sweep-reports -type f -print -quit)"
      - uses: actions/upload-artifact@v6
        if: always() && steps.export.outcome == 'success'
        with:
          name: sweep-daily
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  passage-shards:
    needs: prepare
    if: inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-html
          path: prepared/html
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Run passage shard
        run: |
          set -euo pipefail
          HTML="$(find prepared/html -name 'Degrees of Lewdity.html' -print -quit)"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          python tools/passage_sweep.py "$HTML" --fixture "$FIXTURE" \
            --shard-index "${{ matrix.shard }}" --shard-count 4 \
            --out ".local/sweep/passage-shard-${{ matrix.shard }}"
      - name: Export sanitized reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-passage-shard-${{ matrix.shard }}
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  scenario:
    needs: prepare
    if: inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-html
          path: prepared/html
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Run scenario suite
        run: |
          set -euo pipefail
          HTML="$(find prepared/html -name 'Degrees of Lewdity.html' -print -quit)"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          python tools/scenario_sweep.py "$HTML" --fixture "$FIXTURE" \
            --suite all --seed "$SWEEP_SEED" --out .local/sweep/full-scenario
      - name: Export sanitized reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-scenario
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  env-shards:
    needs: prepare
    if: inputs.tier == 'full' || inputs.tier == 'env-full'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-html
          path: prepared/html
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Run environment shard
        run: |
          set -euo pipefail
          HTML="$(find prepared/html -name 'Degrees of Lewdity.html' -print -quit)"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          python tools/env_matrix.py --target "$HTML" --fixture "$FIXTURE" \
            --tier full --shard-index "${{ matrix.shard }}" --shard-count 8 \
            --seed "$SWEEP_SEED" --out ".local/sweep/env-shard-${{ matrix.shard }}"
      - name: Export sanitized reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-env-shard-${{ matrix.shard }}
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  combat-shards:
    needs: prepare
    if: inputs.tier == 'combat-full'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: sweep-html
          path: prepared/html
      - uses: actions/download-artifact@v6
        with:
          name: sweep-fixture
          path: prepared/fixture
      - name: Run combat shard
        run: |
          set -euo pipefail
          HTML="$(find prepared/html -name 'Degrees of Lewdity.html' -print -quit)"
          FIXTURE="$(find prepared/fixture -name 'ci-base.json' -print -quit)"
          python tools/combat_sweep.py "$HTML" --fixture "$FIXTURE" \
            --tier initiators --shard-index "${{ matrix.shard }}" --shard-count 8 \
            --seed "$SWEEP_SEED" --out ".local/sweep/combat-shard-${{ matrix.shard }}"
      - name: Export sanitized reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sweep-reports
          (cd .local/sweep && find . -type f \
            \( -name '*-sweep.json' -o -name '*-sweep.md' \
               -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp --parents {} ../../sweep-reports/ \;)
          python tools/report_sanitize.py sweep-reports
          python tools/report_sanitize.py --check sweep-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-combat-shard-${{ matrix.shard }}
          path: sweep-reports
          if-no-files-found: error
          retention-days: 30

  summary:
    needs:
      - prepare
      - daily
      - passage-shards
      - scenario
      - env-shards
      - combat-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v6
        with:
          pattern: sweep-*
          path: shard-artifacts
          merge-multiple: true
      - name: Aggregate shards
        run: |
          set -euo pipefail
          case "${{ inputs.tier }}" in
            daily) EXPECTED=4 ;;
            full) EXPECTED=13 ;;
            combat-full) EXPECTED=8 ;;
            env-full) EXPECTED=8 ;;
            *) echo "unknown tier"; exit 2 ;;
          esac
          REPORTS="$(find shard-artifacts -type f \( -name '*-sweep.json' -o -name '*-report.json' \) | sort)"
          if [ -z "${REPORTS}" ]; then
            echo "::error::no sanitized shard reports downloaded"
            exit 1
          fi
          python tools/sweep_summary.py ${REPORTS} \
            --expected-shards "${EXPECTED}" --out sweep-summary
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-summary-${{ github.run_id }}
          path: sweep-summary
          if-no-files-found: warn
          retention-days: 30
