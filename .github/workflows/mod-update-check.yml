name: Mod Update Check

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check mod updates and observed upstreams
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check_mod_updates.py --output output/mod-updates.json --markdown output/mod-updates.md
      - name: Write summary
        if: always()
        run: |
          if [ -f output/mod-updates.md ]; then
            cat output/mod-updates.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "更新检查失败：报告未生成，请查看任务日志。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-update-report
          path: |
            output/mod-updates.json
            output/mod-updates.md
          if-no-files-found: error
          retention-days: 30
