name: Mod Update Check

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日 UTC 00:00 运行
  workflow_dispatch:  # 允许手动触发

jobs:
  check-updates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Check mod updates
        id: check
        run: |
          python tools/check_mod_updates.py --output output/mod-updates.json
          
          # 检查是否有更新
          if [ -f output/mod-updates.json ]; then
            HAS_UPDATES=$(python -c "import json; data=json.load(open('output/mod-updates.json')); print(data.get('has_updates', False))")
            echo "has_updates=$HAS_UPDATES" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-update-report
          path: output/mod-updates.json
          retention-days: 30
      
      - name: Create issue if updates found
        if: steps.check.outputs.has_updates == 'True'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // 读取更新报告
            let updates;
            try {
              updates = JSON.parse(fs.readFileSync('output/mod-updates.json', 'utf8'));
            } catch (error) {
              console.log('无法读取更新报告');
              return;
            }
            
            // 构建 Issue 内容
            let body = '## 🔄 检测到 Mod 更新\n\n';
            body += `**检测时间**: ${updates.timestamp || new Date().toISOString()}\n\n`;
            
            if (updates.updates && updates.updates.length > 0) {
              body += '### 可用更新\n\n';
              
              for (const mod of updates.updates) {
                body += `#### ${mod.name}\n`;
                body += `- **当前版本**: ${mod.current_version}\n`;
                body += `- **最新版本**: ${mod.latest_version}\n`;
                body += `- **仓库**: ${mod.repo_url}\n`;
                body += `- **发布日期**: ${mod.release_date || 'N/A'}\n`;
                
                if (mod.changelog) {
                  body += `- **更新日志**: ${mod.changelog}\n`;
                }
                
                body += '\n';
              }
            }
            
            body += '### 📋 处理步骤\n\n';
            body += '1. 查看上游 Release Notes\n';
            body += '2. 评估兼容性影响\n';
            body += '3. 更新 `config/build.toml` 中的版本号\n';
            body += '4. 运行测试验证\n';
            body += '5. 提交更新\n\n';
            body += '---\n';
            body += '*此 Issue 由 GitHub Actions 自动创建*';
            
            // 检查是否已存在类似 Issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mod-update',
              per_page: 10
            });
            
            // 如果已有未关闭的 mod-update Issue，添加评论而不是创建新 Issue
            if (existingIssues.data.length > 0) {
              const latestIssue = existingIssues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: latestIssue.number,
                body: `## 新的更新检测\n\n${body}`
              });
              console.log(`已在现有 Issue #${latestIssue.number} 中添加评论`);
            } else {
              // 创建新 Issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔄 发现 Mod 更新 (${new Date().toISOString().split('T')[0]})`,
                body: body,
                labels: ['mod-update', 'automation']
              });
              console.log(`已创建 Issue #${issue.data.number}`);
            }
      
      - name: Summary
        if: always()
        run: |
          echo "## Mod 更新检查完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check.outputs.has_updates }}" = "True" ]; then
            echo "✅ 发现可用更新，已创建 Issue" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 所有 Mod 均为最新版本" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "查看详细报告: [mod-updates.json](./mod-updates.json)" >> $GITHUB_STEP_SUMMARY
