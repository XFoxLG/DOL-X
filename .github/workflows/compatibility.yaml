name: Compatibility Tests

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches: [vega]
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: '运行慢速测试（需要网络请求）'
        required: false
        type: boolean
        default: false

jobs:
  config-tests:
    name: 配置与矩阵测试
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run config tests
        run: |
          pytest tests/test_build_matrix.py tests/test_mod_config.py -v --tb=short
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-test-results
          path: |
            .pytest_cache/
            output/

  mod-audit:
    name: Mod 资源审计
    runs-on: ubuntu-latest
    needs: config-tests
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run mod audit
        id: audit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/mod_audit.py --output-dir output
      
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-audit-reports
          path: |
            output/mod-compatibility-report.json
            output/mod-compatibility-report.md
      
      - name: Check audit results
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning::Mod 审计发现高风险问题，请查看报告"
          if [ -f output/mod-compatibility-report.md ]; then
            cat output/mod-compatibility-report.md
          else
            echo "::error::审计脚本未生成报告，请查看 Run mod audit 步骤日志"
          fi
          exit 1
      
      - name: Comment PR with audit summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'output/mod-compatibility-report.md';
            
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              const summary = report.split('## 详细列表')[0];
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Mod 兼容性审计报告\n\n${summary}\n\n完整报告见 artifacts。`
              });
            }

  # TODO: Phase 3 - 下载构建产物用于 HTML smoke test
  # download-build-artifacts:
  #   name: 下载构建产物
  #   runs-on: ubuntu-latest
  #   needs: config-tests
  #   if: ${{ github.event.workflow_run.conclusion == 'success' }}
  #   
  #   steps:
  #     - name: Download artifacts from Build workflow
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: dol-builds-zip
  #         path: build-artifacts/
  #         run-id: ${{ github.event.workflow_run.id }}
  #         github-token: ${{ secrets.GITHUB_TOKEN }}

  slow-tests:
    name: 慢速测试（可选）
    runs-on: ubuntu-latest
    if: github.event.inputs.run_slow_tests == 'true' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run slow tests
        run: |
          pytest tests/ -v -m slow --tb=short

  summary:
    name: 测试总结
    runs-on: ubuntu-latest
    needs: [config-tests, mod-audit]
    if: always()
    
    steps:
      - name: Check results
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::notice::Build workflow concluded as '${{ github.event.workflow_run.conclusion }}'; skipping compatibility tests"
            exit 0
          fi

          if [ "${{ needs.config-tests.result }}" != "success" ]; then
            echo "::error::配置测试失败"
            exit 1
          fi
          
          if [ "${{ needs.mod-audit.result }}" == "failure" ]; then
            echo "::warning::Mod 审计发现问题，但不阻断构建"
          fi
          
          echo "✓ Phase 1 & 2 兼容性测试完成"
          echo "ℹ️ Phase 3 (HTML smoke test) 待实现"
