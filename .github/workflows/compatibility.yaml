name: Compatibility Tests

on:
  # 暂时禁用自动触发，只允许手动运行
  # Compatibility Tests 持续失败，需要修复后再启用自动触发
  # workflow_run:
  #   workflows: ["Build"]
  #   types:
  #     - completed
  #   branches:
  #     - vega
  #     - "experiment/**"
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build workflow run id to download canary artifacts from'
        required: false
        type: string
      run_canary_browser_smoke:
        description: '运行 cheatExtended/maplebirch canary browser smoke'
        required: false
        type: boolean
        default: false
      run_slow_tests:
        description: '运行慢速测试（需要网络请求）'
        required: false
        type: boolean
        default: false

concurrency:
  group: compatibility-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  config-tests:
    name: 配置与矩阵测试
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout workflow run head
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout selected ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run config tests
        run: |
          python -m pytest tests/ -v --tb=short -m "not slow"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-test-results
          path: |
            .pytest_cache/
            output/
          if-no-files-found: ignore

  mod-audit:
    name: Mod 资源审计
    runs-on: ubuntu-latest
    needs: config-tests
    
    steps:
      - name: Checkout workflow run head
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout selected ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run mod audit
        id: audit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/mod_audit.py --output-dir output

      - name: Run cheatExtended replacement audit
        id: cheat_extended_audit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/cheat_extended_audit.py --output-dir output
      
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-audit-reports
          path: |
            output/mod-compatibility-report.json
            output/mod-compatibility-report.md
            output/cheat-extended-replacement-report.json
            output/cheat-extended-replacement-report.md
      
      - name: Check audit results
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning::Mod 审计发现高风险问题，请查看报告"
          if [ -f output/mod-compatibility-report.md ]; then
            cat output/mod-compatibility-report.md
          else
            echo "::error::审计脚本未生成报告，请查看 Run mod audit 步骤日志"
          fi

      - name: Check cheatExtended audit results
        if: steps.cheat_extended_audit.outcome == 'failure'
        run: |
          echo "::warning::cheatExtended 替代性审计未完成，请查看 Run cheatExtended replacement audit 步骤日志"
          if [ -f output/cheat-extended-replacement-report.md ]; then
            cat output/cheat-extended-replacement-report.md
          fi
      
      - name: Comment PR with audit summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'output/mod-compatibility-report.md';
            
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              const summary = report.split('## 详细列表')[0];
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Mod 兼容性审计报告\n\n${summary}\n\n完整报告见 artifacts。`
              });
            }

  html-smoke:
    name: Phase 3 HTML smoke test
    runs-on: ubuntu-latest
    needs: config-tests
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    continue-on-error: true

    steps:
      - name: Checkout workflow run head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download ZIP sample artifact from Build workflow
        uses: actions/download-artifact@v4
        with:
          name: dol-builds-zip-sample
          path: build-artifacts/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run static HTML smoke test
        env:
          DOLX_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DOLX_WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DOLX_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DOLX_GITHUB_SHA: ${{ github.sha }}
          DOLX_ARTIFACT_NAME: dol-builds-zip-sample
        run: |
          python tools/html_smoke_test.py build-artifacts --output output/html-smoke-report.json

      - name: Upload HTML smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-smoke-report
          path: output/html-smoke-report.json

  browser-smoke:
    name: Phase 4 browser smoke test
    runs-on: ubuntu-latest
    needs: html-smoke
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout workflow run head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download ZIP sample artifact from Build workflow
        uses: actions/download-artifact@v4
        with:
          name: dol-builds-zip-sample
          path: build-artifacts/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser smoke dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run browser smoke test in report-only mode
        env:
          DOLX_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DOLX_WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DOLX_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DOLX_GITHUB_SHA: ${{ github.sha }}
          DOLX_ARTIFACT_NAME: dol-builds-zip-sample
        run: |
          PROFILE="ucb-more-love-custom-spellbook"
          python tools/browser_smoke_test.py build-artifacts --output-dir output/browser-smoke --report-only --profile "${PROFILE}"

      - name: Add browser smoke summary
        if: always()
        run: |
          if [ -f output/browser-smoke/browser-smoke-report.md ]; then
            cat output/browser-smoke/browser-smoke-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Phase 4 Browser Smoke" >> "$GITHUB_STEP_SUMMARY"
            echo "browser-smoke-report.md was not generated; inspect job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload browser smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report
          path: output/browser-smoke/
          retention-days: 3

  cheat-canary-browser-smoke:
    name: cheatExtended/maplebirch canary browser smoke
    runs-on: ubuntu-latest
    needs: config-tests
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'experiment/cheat-extended-maplebirch') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_canary_browser_smoke == 'true') }}
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout workflow run head
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout selected ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Validate canary workflow dispatch inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_canary_browser_smoke == 'true' && github.event.inputs.build_run_id == ''
        run: |
          echo "::error::build_run_id is required when run_canary_browser_smoke is true"
          exit 1

      - name: Download cheatExtended/maplebirch canary ZIP artifact from Build workflow
        uses: actions/download-artifact@v4
        with:
          name: dol-builds-cheat-canary-zip
          path: canary-artifacts/
          run-id: ${{ github.event.workflow_run.id || github.event.inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser smoke dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run canary browser smoke test in report-only mode
        env:
          DOLX_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.build_run_id }}
          DOLX_WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          DOLX_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DOLX_GITHUB_SHA: ${{ github.sha }}
          DOLX_ARTIFACT_NAME: dol-builds-cheat-canary-zip
        run: |
          python tools/browser_smoke_test.py canary-artifacts \
            --output-dir output/cheat-canary-browser-smoke \
            --report-only \
            --profile ucb-cheat-extended-maplebirch

      - name: Add canary browser smoke summary
        if: always()
        run: |
          if [ -f output/cheat-canary-browser-smoke/browser-smoke-report.md ]; then
            cat output/cheat-canary-browser-smoke/browser-smoke-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## cheatExtended/maplebirch Canary Browser Smoke" >> "$GITHUB_STEP_SUMMARY"
            echo "browser-smoke-report.md was not generated; inspect job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload canary browser smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cheat-canary-browser-smoke-report
          path: output/cheat-canary-browser-smoke/
          retention-days: 3

  slow-tests:
    name: 慢速测试（可选）
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_slow_tests == 'true' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run slow tests
        run: |
          pytest tests/ -v -m slow --tb=short

  summary:
    name: 测试总结
    runs-on: ubuntu-latest
    needs: [config-tests, mod-audit, html-smoke, browser-smoke, cheat-canary-browser-smoke]
    if: always()
    
    steps:
      - name: Check results
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::notice::Build workflow concluded as '${{ github.event.workflow_run.conclusion }}'; skipping compatibility tests"
            exit 0
          fi

          if [ "${{ needs.config-tests.result }}" != "success" ]; then
            echo "::error::配置测试失败"
            exit 1
          fi
          
          if [ "${{ needs.mod-audit.result }}" == "failure" ]; then
            echo "::warning::Mod 审计发现问题，但不阻断构建"
          fi

          if [ "${{ needs.html-smoke.result }}" == "failure" ]; then
            echo "::warning::Phase 3 HTML smoke test 发现问题，请查看 html-smoke-report artifact"
          fi

          if [ "${{ needs.browser-smoke.result }}" == "failure" ]; then
            echo "::warning::Phase 4 browser smoke test 发现运行时风险，请查看 browser-smoke-report artifact"
          fi

          if [ "${{ needs.cheat-canary-browser-smoke.result }}" == "failure" ]; then
            echo "::warning::cheatExtended/maplebirch canary browser smoke 发现运行时风险，请查看 cheat-canary-browser-smoke-report artifact"
          fi
          
          echo "✓ Phase 1 & 2 兼容性测试完成"
          echo "✓ Phase 3 静态 HTML smoke test 已启用（非阻断）"
          echo "✓ Phase 4 浏览器运行 smoke test 已启用（report-only，非阻断）"
          echo "INFO: cheatExtended/maplebirch canary browser smoke is separate from stable sample smoke and remains report-only."
          echo "INFO: Phase 4 成功仅表示报告已生成；运行时 high-risk 请查看 browser-smoke-report.md / browser-smoke-summary.json"
