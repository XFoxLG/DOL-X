# MOD 组合配置

# 自用构建列表：构建 UCB 基础版，以及 AU + UCB + 作弊/CSD 三个组合。
# 使用显式列表可以避免新增 feature 后自动膨胀出不需要的版本。
build_codes = ["24834", "25858", "26882", "28930"]

# 基础版显示名称对应的组合：UCB + 作弊/CSD。
base_code = 24834

# 推荐的组合（优先显示）
recommended = [25858, 26882, 28930]

# 白名单（额外添加的组合，即使不满足规则也会生成）。
# 已改为 build_codes 精确控制，当前不再依赖白名单。
whitelist = []

# 黑名单（排除的组合）
blacklist = []

# Polyfill 配置
[polyfill]
enabled = false
code = 3
