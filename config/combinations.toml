# MOD 组合配置

# 稳定自用构建列表：BESC + UCB + more-love + custom-spellbook + cheatExtended+maplebirch。
# cheat_csd (bit 2) 已废弃，替换为 cheat_extended_maplebirch (bit 32768)。
# 计算：1 (besc) + 256 (ucb) + 8192 (more_love) + 16384 (custom_spellbook) + 32768 (cheat_extended_maplebirch) = 57601
# AU 变体：+ 1024 (au-f) = 58625, + 2048 (au-m) = 59649, + 4096 (au-a) = 61697
build_codes = ["57601", "58625", "59649", "61697"]

# 基础版显示名称对应的组合：BESC + UCB + more-love + custom-spellbook + cheatExtended。
base_code = 57601

# 推荐的组合（优先显示）
recommended = [58370, 59394, 61442]

# 白名单（额外添加的组合，即使不满足规则也会生成）。
# 已改为 build_codes 精确控制，当前不再依赖白名单。
whitelist = []

# 黑名单（排除的组合）
blacklist = []

# Polyfill 配置
[polyfill]
enabled = false
code = 3
