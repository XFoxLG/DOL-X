# MOD 组合配置

# DOL-X 自用构建列表（v4.1.8 稳定版 + 临时兼容补丁）：UCB + more-love + cheatExtended+maplebirch + custom_hair + mae_picvary + maplebirch_expansion
# 策略说明：
#   - 升级框架到 v4.1.8（修复 AU Face basehead.png 路径问题）
#   - 升级 Cheat Extended 到 v1.19（完全兼容 v4.x，新增农场助手、成就解锁等功能）
#   - expansion v1.2.4 临时兼容补丁（patches/expansion_v4_compat.js），等待 v1.2.5+ 原生支持 v4.x
#   - 移除 Custom-Spellbook：Cheat Extended 的言灵集功能已完全覆盖（2026-06-17实测）
#   - 待 expansion 更新支持 v4.x 后移除补丁
#
# 计算（包含所有必选mod）：
# 基础: 499968 = 256 (ucb) + 8192 (more_love) + 32768 (cheat_extended_maplebirch) + 65536 (custom_hair) + 131072 (mae_picvary) + 262144 (maplebirch_expansion)
# AU 变体：+ 1024 (au-f) = 500992, + 2048 (au-m) = 502016, + 4096 (au-a) = 504064
build_codes = ["499968", "500992", "502016", "504064"]

# 基础版显示名称对应的组合（无AU）
base_code = 499968

# 推荐的组合（优先显示）
recommended = [500992, 502016, 504064]

# 白名单（额外添加的组合，即使不满足规则也会生成）。
# 已改为 build_codes 精确控制，当前不再依赖白名单。
whitelist = []

# 黑名单（排除的组合）
blacklist = []

# Polyfill 配置
[polyfill]
enabled = false
code = 3
