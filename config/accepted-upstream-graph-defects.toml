# testing-encounters-ui.twee, loc-cave/pub.twee, loc-livestock/barn.twee and
# loc-estate/manor.twee at the tag and read back every cited line verbatim, so
# no entry depends on the built artifact alone any more.
# ---------------------------------------------------------------------------

