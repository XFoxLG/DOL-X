# DOL-X: 集成于 2026-07-01，锁定 v0.2.3（最新 release，asset DOLI.mod.zip）。
# LLM AI 对话/战斗文本增强，需玩家在游戏内自填 OpenAI 兼容 API key；构建绝不嵌 key。
# 0.2.x 早期阶段，按保守策略钉死 v0.2.3 不跟 latest 漂。许可证 CC BY-NC-SA 4.0。
# 版本号双身份（2026-08-02 核验）：Release tag 是 v0.2.3，但包内 boot.json 声明
#   version="0.2.2"，作者未同步升 manifest。ModLoader 读 boot.json，所以运行时
#   显示 [DOLI] {v:0.2.2} 属正常，不是构建取到旧包。
# maplebirch 集成是软性的：boot.json 的 dependenceInfo 只要求 ModLoader ^2.0.0；
#   addonPlugin 虽声明 maplebirch ^3.1.0，但用户真机已确认 DOLI 在当前 4.1.13 栈中可运行。
#   不再仅凭声明范围推断框架入口是否注册。DOLI 自带 patches/overlay-replace.json；它与
#   DOL-X 的构建期图标补丁不是同一件事。后者只把右下角悬浮按钮的旧图片路径改成现名。

# DOL-X (2026-07-30): Legacy-Art-Mods-Compat plus 常驻集成。
# 社区二改 1.0.3-plusV1.1（作者：鎖鏈蝴蝶＠百度貼吧），上游 mirrormirroronwall
# 的 README 明确允许二改二传。相比官方 1.0.3 新增六条 AU Face 图片名映射规则
#（blush{n}/tear(s){n} 的 fallback/override）、灰阶优先、服装路径兼容、服装店
# widget 修改。通过 window.modImgLoaderHooker.addSideHooker 注册 checkImageExist
# + imageGetter，additive hook，不 patch lyra/ 核心。
# 绑定 cheat_extended_maplebirch feature（maplebirch 框架栈是 plus 的运行时宿主），
# 该 feature 是必选位（bit 32768），存在于全部四码，因此 plus 常驻全部四包。
# 不占独立 bit，四码不变。
[[modloader_mods]]
key = "legacy_art_compat"
name = "旧版图片名称适配"
enabled = true
feature_ids = ["cheat_extended_maplebirch"]
github_repo = "XFoxLG/DOL-X"
asset_pattern = "Legacy-Art-Mods-Compat.zip"
release_tag = "legacy-art-compat-plus-v1.1"
download_url = "https://github.com/XFoxLG/DOL-X/releases/download/legacy-art-compat-plus-v1.1/Legacy-Art-Mods-Compat.zip"
track_upstream = false  # 社区二改，不走官方源更新检查；SHA-256 由 mods.lock.json 审核

# 基础 mod 注入配置（按列表顺序处理）
# key: mod 标识，对应 extra_mods 字典中的键
# github_repo: GitHub 仓库，自动下载最新 .mod.zip（可选）
# feature_id: 关联的 feature ID（可选）
# inject: 注入方式，"add" 追加（默认） / "replace" 替换指定 slot
# replace_slot: 替换的 slot 索引（仅 inject="replace" 时有效）

[[base_mods]]
key = "modloader_gui"
github_repo = "DoL-Lyra/sugarcube-2-ModLoaderGui"
inject = "replace"
replace_slot = 0                                  # 替换原始 ModLoader (slot 0)

[[base_mods]]
key = "i18n"
