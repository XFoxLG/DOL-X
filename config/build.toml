download_url = "https://github.com/chris81605/Degrees-of-Lewdity_Cheat_Extended/releases/download/V1.17%28dev%29/cheat_extended.mod.zip"
# DOL-X: Rolled back from v1.19 to v1.17 (2026-06-23)
# Reason: v1.19 requires maplebirch v4.x
# v1.17 provides full Yanling system

[[modloader_mods]]
key = "custom_hair"
name = "自定义染发"
enabled = true
feature_id = "custom_hair"
github_repo = "HiddenCirno/DoL-CustomHair"
asset_pattern = "*.zip"
release_tag = "CustomHair"
download_url = "https://github.com/HiddenCirno/DoL-CustomHair/releases/download/CustomHair/CustomHair.zip"

[[modloader_mods]]
key = "mae_picvary"
