[[modloader_mods]]
key = "more_love"
name = "更多恋人"
enabled = true
feature_id = "more_love"
github_repo = "Nephthelana/DoL-More-Love-Interests-Mod"
asset_pattern = "More.Love.Interests.Mod.mod.zip"
release_tag = "More-Love-Interests-Mod-v0.1.7.0"
download_url = "https://github.com/Nephthelana/DoL-More-Love-Interests-Mod/releases/download/More-Love-Interests-Mod-v0.1.7.0/More.Love.Interests.Mod.mod.zip"
track_upstream = false  # 锁定 v0.1.7.0，download_url 钉死具体 asset，不跟 latest
# 升级 v0.1.6.0 -> v0.1.7.0（2026-08-02）。这是修 bug，不是尝鲜。
# 作者 README 给出版本对照表：v0.5.10.x 的游戏必须用 v0.1.7.0，v0.1.6.0 对应
#   v0.5.7.x。本项目游戏本体是 0.5.10.12，此前钉 v0.1.6.0 属于版本错配。
# 上游 issue #1「关于 v0.5.10.12 后，查看食物偏好爆红的问题」记录了错配的后果，
#   作者当天回复已发布 0.5.10 适配版，即 v0.1.7.0。根因是游戏本体重命名：
#     setup.plants -> setup.foodstuff
#     _foodInfo.ingredients -> _foodInfo.recipe.ingredients
#     <<tendingicon>> 宏删除，替换为 <<foodstufficon>>（直接收 key，不再传图标路径）
#     $plants -> $foodstuff
#     舒芙蕾键名去掉重音：soufflé -> souffle（否则 Avery 单独报错）
#   以上五处已在 v0.1.7.0 包内逐条核对落实。
# 改动面（逐文件 diff）：只有 boot.json、game/foodPreference.js、
#   game/more_love_interest_food_preference.twee、game/more_love_interest_main.twee
#   四个文件变化，无增删文件。main.twee 另有一处行为改动：$auriga_artefact 缺失或
#   Avery 已 dismissed 时从 $loveInterestList 移除 Avery，属上游有意的状态清理。
# 风险复核：boot.json 的 5 条 addonPlugin 替换规则（3 条 TweeReplacer 命中
#   Widgets Attitudes / Widgets，2 条 ReplacePatcher 命中 time.js）在两版之间
#   逐条指纹比对完全一致，因此升级不改变对游戏本体的 patch 面。
# GameVersion 门槛由 >=0.5.5.0 收紧到 >=0.5.10.0，当前 0.5.10.12 满足。
# 回滚：v0.1.6.0 资产已归档在仓库外 mod-archive，digest 见 mods.lock.json 历史。

[[modloader_mods]]
key = "maplebirch"
name = "maplebirch"
enabled = true
feature_id = "cheat_extended_maplebirch"
github_repo = "MaplebirchLeaf/SCML-DOL-maplebirchFramework"
asset_pattern = "maplebirch-0.5.10.12-v4.1.13.mod.zip"
release_tag = "maplebirch-release-v4.1.13"
download_url = "https://github.com/MaplebirchLeaf/SCML-DOL-maplebirchFramework/releases/download/maplebirch-release-v4.1.13/maplebirch-0.5.10.12-v4.1.13.mod.zip"
track_upstream = true  # 构建与更新检查以作者官方仓库为准；XFoxLG 镜像只作官方资产消失时的人工灾备
# DOL-X next-4 experiment (2026-07-28): maplebirch v3.2.5 -> v4.1.13 (upstream 正式 release).
# WHY 升到 4.x（推翻了上一轮"v3.2.5 是唯一解"的结论）:
#   - 上一轮把栈锁在 v3.2.5 的唯一理由是"保住扩展包 maplebirchEx v1.2.4"，但真机
#     实测 v1.2.4 在 v3.2.5 上炸了（理智/灵性属性 dread/sanity/dreadmax 初始化
#     不兼容，maplebirchStatusBar/maplebirchOptions 报 undefined）。
#   - 调研发现作者已把 v1.2.4 删库废弃，功能拆成独立包：LongerCombat v1.0.1 +
#     YanlingCheatCollection v1.0.1，两者 addonPlugin 都声明 maplebirch ^4.1.0，
#     面向游戏 0.5.10.12。扩展包正式继任者 Deadwood-Reblooms（枯木逢春）types
#     依赖 ^4.1.8，也面向 4.x。整个当代生态已迁到 4.x，3.x 是死胡同。
#   - v4.1.6–v4.1.12 已原生修好 NPC/脸部图层的连字符命名问题，因此自研的
#     maplebirch-v3-layer-compat 补丁在 4.x 下退役（已从 build.py 本地注入列表移除）。
#   - cheat_extended v1.20 运行时门控要求框架 >= 3.2.5；4.1.13 >= 3.2.5，门照过。
# SOURCE: MaplebirchLeaf/SCML-DOL-maplebirchFramework release maplebirch-release-v4.1.13
#   (2026-07-01, 正式版, asset maplebirch-0.5.10.12-v4.1.13.mod.zip, 186010 bytes)。
# MIRROR: XFoxLG/DOL-X tag maplebirch-framework-mirror-v4.1.13，仅作人工灾备，
#   不作为日常下载源，否则更新检查只能看到自己的镜像、无法发现作者新版本。
# RISK (experiment target): 跨大版本（3->4）升级，整套 mod 需真机复测；扩展包完整
#   继任者枯木逢春尚未出包，本轮先用拆出的 LongerCombat/Yanling 两个独立功能包。

[[modloader_mods]]
key = "cheat_extended"
name = "cheatExtended"
enabled = true
feature_id = "cheat_extended_maplebirch"
github_repo = "chris81605/Degrees-of-Lewdity_Cheat_Extended"
asset_pattern = "cheat_extended.mod.zip"
release_tag = "Pre-release"
download_url = "https://github.com/chris81605/Degrees-of-Lewdity_Cheat_Extended/releases/download/Pre-release/cheat_extended.mod.zip"
track_upstream = true
include_prerelease_updates = true  # 官方 v1.20 位于 Pre-release 渠道，周检必须读取预发布并比对 asset digest
# DOL-X next-4 experiment (2026-07-27): cheat_extended v1.18 -> v1.20 betaTest.
# WHY v1.20:
#   - Targets game 0.5.10.12 (our current game body); changelog fixes 虚空创造/
#     黑心商店 on 0.5.10.12 and bundles scripts/CE_HeadMaskCompat.js (avoids the
#     0.5.8.10-headwear "变光头" bug on new-naming games).
# RUNTIME SOFT-GATE (verified from the mod's own JS, not boot.json):
#   - boot.json declares NO maplebirch dependency (only ModLoader>=2.17.0,
#     TweeReplacer, ReplacePatcher, ImageLoaderHook, SweetAlert2Mod, GameVersion
#     >=0.5.5.9). The maplebirch requirement is a RUNTIME check:
#     * scriptEarly/framework_detector.js: if maplebirch mod version < 3.2.5 ->
#       SweetAlert2 弹窗 "maplebirch框架版本過低".
#     * scriptEarly/CERegist.js: compareVersions(version,"3.2.5")===1 gate; if
#       it fails, the else branch only logger.error and NONE of the 7 addTo()
#       run -> CE features are NOT registered into the game UI.
#   - Therefore v1.20 REQUIRES maplebirch mod >= 3.2.5. Paired here with
#     maplebirch v4.1.13; 4.1.13 >= 3.2.5 so the runtime gate passes.
# SOURCE: chris81605 Pre-release "V1.20 betaTest"，asset cheat_extended.mod.zip
#   (243765 bytes, sha256 7aa8ab4c…, 资产更新于 2026-07-23)。日常下载与更新检查
#   使用作者官方源；v1.18 mirror 继续作为回滚档案（v1.18 无框架门控）。
#   该 tag 名为 "Pre-release" 且 GitHub 标记 prerelease=true，作者用它承载 1.20
#   开发版；资产会在同一 tag 下原位替换，因此更新检查必须比对 digest 而非 tag 名。

