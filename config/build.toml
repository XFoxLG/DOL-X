# Reason: expansion v1.2.4 incompatible with v4.x (multiple runtime errors)
# Will upgrade to v4.x when expansion v1.2.5+ releases

[[modloader_mods]]
key = "cheat_extended"
name = "cheatExtended"
enabled = true
feature_id = "cheat_extended_maplebirch"
github_repo = "chris81605/Degrees-of-Lewdity_Cheat_Extended"
asset_pattern = "cheat_extended.mod.zip"
