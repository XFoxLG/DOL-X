release_tag = "0.3.1β"
download_url = "https://github.com/sylphiet/Bunny-TransformationCN/releases/download/0.3.1%CE%B2/BunnyTransformation.mod.zip"
# DOL-X: Disabled (2026-06-24)
# Reason: v0.3.1β incompatible with current game version
# 16 TweeReplacer errors (trying to patch non-existent fox transformation system)
# Causes combat system crash: "Cannot use 'in' operator to search for 'wings' in undefined"

[[modloader_mods]]
key = "neoui_patch"
name = "NeoUI Patch"
enabled = false
feature_id = "neoui_patch"
github_repo = "RyaraSUKI/dol-neoui-patch"
asset_pattern = "*.zip"
release_tag = "release"
download_url = "https://github.com/RyaraSUKI/dol-neoui-patch/releases/download/release/neoui_patch_1.1.0.zip"
# DOL-X: Disabled (2026-06-24)
# Design conflict: overlay layout (covers content) vs push layout (DOL-X preference)
# Author intentionally fixes #story { margin-left: 3.5em } to create drawer-style sidebar
# that overlays content, conflicting with sidebar beautification mods
# User experience: sidebar covers game content when expanded (bad for widescreen users)
# Alternative: implement click-to-close feature separately if needed

[[modloader_mods]]
key = "npc_social_icon"
name = "NPC社交栏头像"
