[[modloader_mods]]
key = "guide_to_me"
name = "控制NPC嘴部"
enabled = true
feature_id = "guide_to_me"
github_repo = "Ayndpa/DOL-GuideToMe"
asset_pattern = "*.zip"
release_tag = "1.1.0"
download_url = "https://github.com/Ayndpa/DOL-GuideToMe/releases/download/1.1.0/GuideToMe.zip"

[[modloader_mods]]
key = "bunny_transformation"
name = "变身兔兔"
enabled = false
feature_id = "bunny_transformation"
github_repo = "sylphiet/Bunny-TransformationCN"
