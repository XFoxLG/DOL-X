# 构建配置

[urls]
# 工具下载地址
apktool = "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar"
uber_apk_signer = "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"

# DOLP 基础 URL
dolp_base = "https://gitgud.io/Frostberg/degrees-of-lewdity-plus/-/archive/master/degrees-of-lewdity-plus-master.tar.gz?path=imagepacks"

[paths]
# 工作目录
workspace = "workspace"
output = "output"

# 子目录（相对于 workspace）
extract = "extract"
temp = "temp"
signed = "signed"
base = "base"
prepare_package = "prepare_package"

[github]
# GitHub 发布配置
owner = "sakarie9"
repo = "DoL-Lyra"

# APK 包名替换规则
[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol"'
replacement = '"com.vrelnir.dol.lyra"'

[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol_debug"'
replacement = '"com.vrelnir.dol.lyra"'

[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol.androidx-startup"'
replacement = '"com.vrelnir.dol.lyra.androidx-startup"'

[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol_debug.androidx-startup"'
replacement = '"com.vrelnir.dol.lyra.androidx-startup"'

[[apk.replacements]]
file = "res/values/strings.xml"
pattern = "DoL"
replacement = "DoL Lyra"

[[apk.replacements]]
file = "res/values/strings.xml"
pattern = "Degrees of Lewdity"
replacement = "DoL Lyra"

[[apk.replacements]]
file = "assets/www/index.html"
pattern = "saveAs("
replacement = "cordova.plugins.saveDialog.saveFile("

# 图片包配置
[imagepacks.besc]
name = "besc"
urls = [
    "{dolp_base}/dolp",
    "{dolp_base}/b3s",
    "{dolp_base}/kaervek",
    "{dolp_base}/dolp_b3s",
]

[imagepacks.besc.case_fixes]
"img/hair/fringe/Messy curls" = "img/hair/fringe/messy curls"
"img/hair/sides/messy ponytail/Shoulder.png" = "img/hair/sides/messy ponytail/shoulder.png"

[imagepacks.hikari]
name = "hikari"
urls = ["{dolp_base}/b3s_hikfem", "{dolp_base}/b3s_hikfemsubs"]
files_to_remove = [
    "img/hair/fringe/Messy curls",
    "img/clothes/face/foxmask/Full.png",
]

[imagepacks.goose]
name = "goose"
urls = ["{dolp_base}/dolp", "{dolp_base}/goosefem", "{dolp_base}/goosefemsubs"]

[imagepacks.ucb]
name = "ucb"
urls = ["{dolp_base}/mysterious"]
files_to_remove = [
    "img/sex/missionary/active/virginkiller/chest.png",
    "img/sex/missionary/active/virginkiller/waist.png",
]

# Modloader mod 配置
# 通过 feature_id / feature_ids 关联 features.toml 中的功能定义。
# feature_ids 表示命中任意一个 feature 时注入，key 用作唯一缓存名。
[[modloader_mods]]
feature_id = "au-f"
github_repo = "AOKIUTAGE/UTAGEsDOL3.0"
asset_pattern = "AUfemale.model"
release_tag = "mod"

[[modloader_mods]]
feature_id = "au-m"
github_repo = "AOKIUTAGE/UTAGEsDOL3.0"
asset_pattern = "AUmale.model"
release_tag = "mod"

[[modloader_mods]]
feature_id = "au-a"
github_repo = "AOKIUTAGE/UTAGEsDOL3.0"
asset_pattern = "AUandrogynous.model"
release_tag = "mod"

[[modloader_mods]]
key = "au_face"
name = "AU面部扩展"
feature_ids = ["au-f", "au-m", "au-a"]
github_repo = "AOKIUTAGE/UTAGEsDOL3.0"
asset_pattern = "AUsDoL.facial.expansion.mod.zip"
release_tag = "facemod"

[[modloader_mods]]
key = "bjx_word_unlock"
name = "言灵解放"
enabled = true
feature_id = "cheat_csd"
github_repo = "cphxj123/Dol-BJX-Mods"
asset_pattern = "言灵解放1.1.0.zip"
release_tag = "1.1.0"
download_url = "https://github.com/cphxj123/Dol-BJX-Mods/raw/main/%E8%A8%80%E7%81%B5%E8%A7%A3%E6%94%BE1.1.0.zip"

[[modloader_mods]]
key = "bjx_portable_word"
name = "随身言灵"
enabled = true
feature_id = "cheat_csd"
github_repo = "cphxj123/Dol-BJX-Mods"
asset_pattern = "随身言灵1.1.0.zip"
release_tag = "1.1.0"
download_url = "https://github.com/cphxj123/Dol-BJX-Mods/raw/main/%E9%9A%8F%E8%BA%AB%E8%A8%80%E7%81%B51.1.0.zip"

[[modloader_mods]]
key = "bccm"
name = "随时施法"
enabled = true
feature_id = "cheat_csd"
github_repo = "Tony70124/BetterCheatCommandManagement-for-DOL"
asset_pattern = "BCCM_v2.1.4.zip"
release_tag = "v2.1.4"
download_url = "https://github.com/Tony70124/BetterCheatCommandManagement-for-DOL/releases/download/v2.1.4/BCCM_v2.1.4.zip"

# 基础 mod 注入配置（按列表顺序处理）
# key: mod 标识，对应 extra_mods 字典中的键
# github_repo: GitHub 仓库，自动下载最新 .mod.zip（可选）
# feature_id: 关联的 feature ID（可选）
# inject: 注入方式，"add" 追加（默认） / "replace" 替换指定 slot
# replace_slot: 替换的 slot 索引（仅 inject="replace" 时有效）

[[base_mods]]
key = "modloader_gui"
github_repo = "DoL-Lyra/sugarcube-2-ModLoaderGui"
inject = "replace"
replace_slot = 0                                  # 替换原始 ModLoader (slot 0)

[[base_mods]]
key = "i18n"

[[base_mods]]
key = "cheat"
feature_id = "cheat_csd"
github_repo = "DoL-Lyra/Cheat"

[[base_mods]]
key = "csd"
feature_id = "cheat_csd"
github_repo = "DoL-Lyra/CombatStatusDisplay"
