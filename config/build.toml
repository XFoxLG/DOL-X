# 构建配置

[urls]
# 工具下载地址
apktool = "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar"
uber_apk_signer = "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"

# DOLP 基础 URL
dolp_base = "https://gitgud.io/Frostberg/degrees-of-lewdity-plus/-/archive/master/degrees-of-lewdity-plus-master.tar.gz?path=imagepacks"

[paths]
# 工作目录
workspace = "workspace"
output = "output"

# 子目录（相对于 workspace）
extract = "extract"
temp = "temp"
signed = "signed"
base = "base"
prepare_package = "prepare_package"

[github]
# GitHub 发布配置
owner = "XFoxLG"
repo = "DOL-X"

[identity]
# 自用整合包标识，仅用于产物文件名、APK 显示名称和包名。
name = "XFox"
apk_name = "DoL XFox"
package = "com.vrelnir.dol.xfox"

# APK 包名替换规则
[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol"'
replacement = '"com.vrelnir.dol.xfox"'

[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol_debug"'
replacement = '"com.vrelnir.dol.xfox"'

[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol.androidx-startup"'
replacement = '"com.vrelnir.dol.xfox.androidx-startup"'

[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol_debug.androidx-startup"'
replacement = '"com.vrelnir.dol.xfox.androidx-startup"'

[[apk.replacements]]
file = "res/values/strings.xml"
pattern = "DoL"
replacement = "DoL XFox"

[[apk.replacements]]
file = "res/values/strings.xml"
pattern = "Degrees of Lewdity"
replacement = "DoL XFox"

[[apk.replacements]]
file = "assets/www/index.html"
pattern = "saveAs("
replacement = "cordova.plugins.saveDialog.saveFile("

# 图片包配置

# BESC imagepack配置（保留用于未来可能的快速恢复）
# 当前DOL-X不使用BESC（features.toml中skip=true），使用UCB作为战斗美化
# 理由：UCB最后应用会覆盖BESC的战斗图片，避免冗余下载和构建时间
# 如需恢复：修改features.toml中skip=false，添加bit 1到build_codes
[imagepacks.besc]
name = "besc"
urls = [
    "{dolp_base}/dolp",
    "{dolp_base}/b3s",
    "{dolp_base}/kaervek",
    "{dolp_base}/dolp_b3s",
]

[imagepacks.besc.case_fixes]
"img/hair/fringe/Messy curls" = "img/hair/fringe/messy curls"
"img/hair/sides/messy ponytail/Shoulder.png" = "img/hair/sides/messy ponytail/shoulder.png"

[imagepacks.hikari]
name = "hikari"
urls = ["{dolp_base}/b3s_hikfem", "{dolp_base}/b3s_hikfemsubs"]
files_to_remove = [
    "img/hair/fringe/Messy curls",
    "img/clothes/face/foxmask/Full.png",
]

[imagepacks.goose]
name = "goose"
urls = ["{dolp_base}/dolp", "{dolp_base}/goosefem", "{dolp_base}/goosefemsubs"]

[imagepacks.ucb]
name = "ucb"
# 优先使用 GitHub Release 镜像（绕过 GitGud.io IP 限制）
# Fallback 到 GitGud.io（如果镜像失败）
urls = [
    "https://github.com/XFoxLG/DOL-X/releases/download/imagepack-mirror-v1/degrees-of-lewdity-plus-master-imagepacks-mysterious.tar.gz",
    "{dolp_base}/mysterious"
]
files_to_remove = [
    "img/sex/missionary/active/virginkiller/chest.png",
    "img/sex/missionary/active/virginkiller/waist.png",
]

# Modloader mod 配置
# 通过 feature_id / feature_ids 关联 features.toml 中的功能定义。
# feature_ids 表示命中任意一个 feature 时注入，key 用作唯一缓存名。
[[modloader_mods]]
key = "au_f"
feature_id = "au-f"
github_repo = "AOKIUTAGE/UTAGEsDOL3.0"
asset_pattern = "AUfemale.model_v0.9.3.zip"
release_tag = "mod"
track_upstream = false  # 锁定精确 model asset，release tag 恒为 "mod"，无版本可追

