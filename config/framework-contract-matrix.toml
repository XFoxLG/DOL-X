lesson = "Never resolve a framework version from a tag name, a filename, or the metadata version alone. Combine metadata version, export presence and the GameVersion floor."


[fork_fidelity]
# 2026-10-14 audit of how faithfully JohnLiao501/SCML-DOL-maplebirchFramework
# preserves the upstream repository (methods: `git ls-remote` SHA comparison,
# `git merge-base --is-ancestor`, src/ occurrence fingerprinting, upstream release
# asset re-download + sha256 compare).
audit_date = "2026-10-14"
# Every tag present on BOTH upstream and the fork has an identical commit SHA, so
# the trees/history are byte-identical by Git content addressing.
shared_tags_compared = 5
shared_tags_identical = [
    "maplebirch-release-v3.1.14",
    "maplebirch-release-v4.0.2",
    "maplebirch-release-v4.1.14",
    "maplebirch-release-v4.2.9",
    "maplebirch-release-v4.3.5",
]
# Fork-only tags that prove ancestry into the shared, byte-identical DAG:
#   v4.1.13 is an ancestor of v4.1.14 (shared)   -> Deleted-era tags ride the
#   v4.1.2  is an ancestor of v4.2.0  (shared)      genuine upstream history.
#   v4.3.0  is an ancestor of v4.3.5 (shared)
# Their content fingerprints (package.json version, faceStyleSrcFn occurrence
# count in src/ = 20, v4.1.2 export count = 0) match this matrix.
fork_only_tags = 29
# The fork preserves source only: its Releases endpoint returns 0 assets.
# Upstream still hosts 9 releases / 14 assets; the build-locked payload
# maplebirch-0.5.10.12-v4.1.14.mod.zip was re-downloaded from the upstream
# release on 2026-10-14 and matches this matrix byte for byte.
fork_release_assets = 0
upstream_releases = 9
upstream_release_assets = 14
notes = "Fork == upstream wherever both still publish a tag; fork-only tags sit on the genuine upstream DAG with matching content fingerprints. Binaries do NOT survive on the fork: trust for the build lock comes from the locally held original plus the surviving upstream release asset, both sha256-verified. Binaries of deleted versions never held locally (e.g. 4.2.0) cannot be recovered byte-verified."
