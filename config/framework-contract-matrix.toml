# DOL-X framework contract matrix - content-over-tag version identity.
#
# Every candidate row is a *content* fingerprint, never a tag name. The build pin
# is maplebirch-release-v4.1.14; the remaining rows exist so that a version change
# can never be accepted on the strength of a filename or a tag string.
#
# All facts below were re-verified on 2026-10-13. Reproduce with:
#   git ls-remote --tags https://github.com/MaplebirchLeaf/SCML-DOL-maplebirchFramework
#   git -C <fork-clone> show <tag>:package.json
#   git -C <fork-clone> show <tag>:src/modules/Character.ts
#   python tools/framework_contract_check.py <payload.mod.zip>
#   python tools/framework_contract_check.py --self-check

schema = "dolx.framework-contract-matrix.v1"
game_version_in_use = "0.5.11.9"
locked_version = "4.1.14"


[archaeology]
upstream_repo = "MaplebirchLeaf/SCML-DOL-maplebirchFramework"
# The upstream repository deletes tags along with releases. 9 remain:
# 3.1.14, 4.0.2, 4.1.14, 4.2.9, 4.3.5, 4.4.1, 5.0.4, 5.1.3, 5.4.2.
upstream_tag_count = 9
upstream_tags_verified = [
    "maplebirch-release-v3.1.14",
    "maplebirch-release-v4.0.2",
    "maplebirch-release-v4.1.14",
    "maplebirch-release-v4.2.9",
    "maplebirch-release-v4.3.5",
    "maplebirch-release-v4.4.1",
    "maplebirch-release-v5.0.4",
    "maplebirch-release-v5.1.3",
    "maplebirch-release-v5.4.2",
]
# A third-party fork preserved 34 tags spanning 3.1.8 through 4.3.5, which is why
# the deleted 4.1.x line is still reproducible at all.
fork_repo = "JohnLiao501/SCML-DOL-maplebirchFramework"
fork_tag_count = 34
fork_tags_span = ["maplebirch-release-v3.1.8", "maplebirch-release-v4.3.5"]
# Software Heritage has never archived this origin, so it is not an independent
# recovery path. `GET /api/1/origin/.../get/` returns HTTP 404 NotFoundExc.
software_heritage_status = "not-archived"
software_heritage_checked = "2026-10-13"


[signature_history]
# `faceStyleSrcFn` is the AU-facing export. Across every recoverable tag from
# 3.1.8 to 4.1.14 the source declaration is single-parameter:
#   function faceStyleSrcFn(name: FaceStyleNameFn | FaceStyleName)
# The minified bundle keeps the same one-parameter shape (see `dist_signature` on
# the held rows). No published version declares a second options parameter, so
# AU's `{ variant: true }` argument has never been a framework API.
declared_parameter_count = 1
source_declaration_verified_tags = 34
minified_declaration_verified_versions = ["4.1.13", "4.1.14"]


[assets]
# Where `--self-check` looks for the payloads of held rows, relative to the
# repository root. Nothing is downloaded here.
search_dirs = [
    ".local/maplebirch-414-investigation",
    ".local/mods",
    ".local/tmp-dl",
    "downloads",
]


